name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "4.5.14"
  BLENDER_SERIES: "4.5"

jobs:
  backend:
    name: Backend tests (Linux, real Blender)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libxi6 libxkbcommon0 libxrender1 libxxf86vm1 libxfixes3 libsm6 libgl1 libegl1
          # V1.2 Office adapters: LibreOffice (recalculation, previews, ODF conversion) + poppler
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc libreoffice-writer libreoffice-impress poppler-utils fonts-dejavu-core
          soffice --version
      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSL -o /tmp/blender.tar.xz https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz
          tar xf /tmp/blender.tar.xz -C ~/blender --strip-components=1
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev,anthropic,gemini]"
      - name: Tests
        working-directory: backend
        run: |
          export DAEDELUS_BLENDER=$HOME/blender/blender
          export DAEDELUS_REQUIRE_LIBREOFFICE=1
          "$DAEDELUS_BLENDER" --version | head -1
          pytest -q -rs --junitxml=../evidence-ci/pytest-linux.xml
      - name: Demonstration scenarios (Section 8)
        run: |
          export DAEDELUS_BLENDER=$HOME/blender/blender
          daedelus demo --out evidence-ci/demo
      - name: V1.1 semantic demonstrations (A-E; live gates reported as blocked without credentials)
        run: |
          export DAEDELUS_BLENDER=$HOME/blender/blender
          daedelus demo-v11 --out evidence-ci/v1_1
      - name: V1.2 research analysis & presentation pipeline (xlsx/docx/pptx + dependencies)
        run: daedelus demo-v12 --out evidence-ci/v1_2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          path: |
            evidence-ci/
            !evidence-ci/demo/workspace/
            !evidence-ci/v1_2/workspace/

  studio:
    name: Studio (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - working-directory: studio
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  e2e:
    name: Studio end-to-end (browser + backend + Blender)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libxi6 libxkbcommon0 libxrender1 libxxf86vm1 libxfixes3 libsm6 libgl1 libegl1
          # V1.2 Office adapters: LibreOffice (recalculation, previews, ODF conversion) + poppler
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc libreoffice-writer libreoffice-impress poppler-utils fonts-dejavu-core
          soffice --version
      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSL -o /tmp/blender.tar.xz https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz
          tar xf /tmp/blender.tar.xz -C ~/blender --strip-components=1
      - name: Install
        run: |
          pip install -e "backend[dev,anthropic,gemini]"
          cd studio && npm ci && npx playwright install --with-deps chromium && npm run build
      - name: Spatial canvas walkthrough (scenarios A-F)
        run: |
          export DAEDELUS_BLENDER=$HOME/blender/blender
          daedelus --workspace /tmp/e2e-ws serve --port 8765 --studio-dist studio/dist > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8765/api/health > /dev/null && break; sleep 1; done
          cd studio && STUDIO_URL=http://127.0.0.1:8765 OUT=../evidence-ci/screenshots node e2e/spatial.e2e.mjs
      - name: V1.1 semantic walkthrough (analysis, context package, plan preview, loop)
        if: always()
        run: cd studio && STUDIO_URL=http://127.0.0.1:8765 OUT=../evidence-ci/semantic node e2e/semantic.e2e.mjs
      - name: V1.2 office walkthrough (grid/document/slides in place, dependency updates)
        if: always()
        run: cd studio && STUDIO_URL=http://127.0.0.1:8765 OUT=../evidence-ci/office node e2e/office.e2e.mjs
      - name: Board performance measurement (150+ items, 200+ connections)
        if: always()
        run: cd studio && STUDIO_URL=http://127.0.0.1:8765 OUT=../evidence-ci/perf node e2e/perf.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: evidence-ci/

  cluster:
    name: V2 cluster (control plane + Blender/Office/code workers, failure injection)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secrets for the throw-away cluster
        run: |
          python - <<'PY'
          import secrets
          w = "wk-" + secrets.token_hex(16)
          open("deploy/.env", "w").write(
              f"DAEDELUS_API_TOKENS=api-{secrets.token_hex(16)}\n"
              f"DAEDELUS_WORKER_TOKENS={w}\nDAEDELUS_WORKER_TOKEN={w}\n")
          PY
      - name: Build images
        run: docker compose -f deploy/compose.yml --env-file deploy/.env build
      - name: Container end-to-end (S1-S8)
        run: |
          pip install "httpx>=0.27"
          python deploy/cluster_e2e.py --env-file deploy/.env --out evidence-ci/v2-cluster --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-cluster-evidence
          path: evidence-ci/
