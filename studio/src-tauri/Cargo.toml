[package]
name = "daedelus-studio"
version = "0.1.0"
description = "Daedelus: universal multimodal agentic creation studio"
edition = "2021"

[lib]
name = "daedelus_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
